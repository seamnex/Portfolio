<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 — Recurso no encontrado · Samuel García Baciliadis</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0B0F19" />
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<!-- Página 404: Vercel la devuelve sola para cualquier ruta que no exista.
     Archivo estático en public/, fuera de React y de Tailwind a propósito:
     tiene que verse aunque el bundle no cargue. Sin JS. Mismo lenguaje
     visual que el sitio: un incidente en la status page. -->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background: #0B0F19; color: #CBD5E1;
    font: 15px/1.6 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  }
  main { width: min(36rem, 100%); }
  .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
  .card { border: 1px solid #1B2333; background: #111827; border-radius: 12px; padding: 28px; }
  .pill {
    display: inline-flex; align-items: center; gap: 8px; border: 1px solid rgba(251,113,133,.35);
    background: rgba(251,113,133,.1); color: #FB7185; border-radius: 999px; padding: 4px 12px; font-size: 12px;
  }
  .punto { width: 8px; height: 8px; border-radius: 50%; background: #FB7185; }
  h1 { margin: 18px 0 6px; color: #fff; font-size: 28px; line-height: 1.2; text-wrap: balance; }
  p { margin: 0; color: #94A3B8; }
  pre {
    margin: 20px 0 0; padding: 12px 14px; border: 1px solid #1B2333; border-radius: 8px;
    background: #070A12; color: #94A3B8; font-size: 12.5px; overflow-x: auto; white-space: pre-wrap;
  }
  .ok { color: #10B981; }
  .acciones { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 10px; }
  a { color: inherit; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; padding: 10px 18px;
    font-weight: 600; font-size: 14px; text-decoration: none; border: 1px solid #1B2333; color: #CBD5E1;
  }
  .btn.primario { background: #06B6D4; border-color: #06B6D4; color: #04111a; }
  .btn:hover { border-color: #06B6D4; }
  .btn:focus-visible { outline: 2px solid #06B6D4; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <div class="card">
    <span class="pill mono"><span class="punto" aria-hidden="true"></span>HTTP 404 · NOT FOUND</span>
    <h1>Este recurso no existe</h1>
    <p>El enlace está mal escrito o la página cambió de lugar. El resto del sistema está operativo.</p>
    <pre class="mono" aria-label="Diagnóstico"><span class="ok">$</span> curl -I esta-ruta
HTTP/2 404
<span class="ok">$</span> echo "volver al inicio"</pre>
    <nav class="acciones" aria-label="Secciones del sitio">
      <a class="btn primario" href="/">Volver al inicio</a>
      <a class="btn" href="/#observabilidad">Observabilidad</a>
      <a class="btn" href="/#laboratorio">Laboratorio</a>
      <a class="btn" href="/#contacto">Contacto</a>
    </nav>
  </div>
</main>
</body>
</html>
