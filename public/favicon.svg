<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Samuel García">
  <!-- La marca del sitio: la barra del incidente. Ámbar hasta la alerta,
       verde el corte, rayado la medición. Pensada para 16 px: tres bloques
       gruesos y dos rayas, sin detalle que el antialiasing se coma. -->
  <defs>
    <clipPath id="m"><rect x="34" y="22" width="22" height="20" rx="3"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="12" fill="#0B0F19"/>
  <rect x="8" y="22" width="16" height="20" rx="3" fill="#F59E0B"/>
  <rect x="26" y="22" width="6" height="20" rx="2" fill="#10B981"/>
  <rect x="34" y="22" width="22" height="20" rx="3" fill="#06B6D4" fill-opacity=".22"/>
  <g clip-path="url(#m)" stroke="#06B6D4" stroke-width="5">
    <line x1="30" y1="46" x2="46" y2="18"/>
    <line x1="42" y1="46" x2="58" y2="18"/>
    <line x1="54" y1="46" x2="70" y2="18"/>
  </g>
</svg>
