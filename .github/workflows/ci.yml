# Verifica en cada push y PR a main que el sitio compile y salga completo.
#
# Vercel ya buildea en cada push, pero avisa tarde y por mail: para cuando
# llega la notificación, el commit roto es el que está publicado. Esto corre
# antes y falla en el PR.
#
# Cuatro capas, porque atrapan cosas distintas:
#
#   contenido       -> los dos diccionarios de idioma son espejo y no hay
#                      enlaces muertos. Es el único chequeo que caza el bug
#                      típico de un sitio bilingüe: una clave agregada en
#                      español y olvidada en inglés no rompe el build, pinta
#                      un hueco en la mitad del sitio que su autor no mira.
#   npm ci + build  -> el proyecto compila desde cero con el lock tal como
#                      está versionado, y de paso genera los CV. Atrapa el
#                      import roto y el "en mi máquina anda" por un
#                      node_modules desactualizado.
#   artefactos      -> el build produjo lo que el HTML promete. Un og:image
#                      apuntando a un archivo que no se copió a dist/ da 200
#                      en el sitio y una card vacía en LinkedIn.
#   consola         -> el intérprete de comandos responde en los dos idiomas
#                      sin romperse ni filtrar `undefined` a la pantalla.
#
# Lo que NO detecta: que la card OG se vea bien, ni que sus números sigan
# coincidiendo con content.js. `npm run og` es manual a propósito — resvg no
# rasteriza byte a byte igual en Linux que en Windows, así que comparar el PNG
# generado en CI contra el versionado daría un rojo permanente y mentiroso.
# El CV no tiene ese problema: lo genera el propio build, así que no puede
# quedar viejo respecto de content.js.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Solo lectura: este workflow no escribe nada en el repo.
permissions:
  contents: read

jobs:
  build:
    name: Build del sitio
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          # Misma mayor que usa Vercel para buildear el proyecto.
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        # `npm ci` y no `npm install`: instala exactamente el lock y falla si
        # está desincronizado de package.json, en vez de arreglarlo en silencio
        # y dejar que CI pruebe un árbol distinto al del repo.
        run: npm ci

      - name: Verificar el contenido y la paridad de idiomas
        # Antes del build: si falta una traducción o hay un link muerto, el
        # error tiene que decir eso, no aparecer como una página en blanco
        # veinte segundos después.
        run: npm run verificar

      - name: Buildear
        # Sin VITE_FORMSPREE_ID a propósito: así CI ejercita el camino de
        # respaldo del formulario, que es el que ve cualquiera que clone el
        # repo sin configurar nada. El build genera también los dos CV.
        run: npm run build

      - name: Verificar los artefactos del build
        run: |
          set -euo pipefail

          test -f dist/index.html || { echo "::error::falta dist/index.html"; exit 1; }

          # La card OG tiene que estar en dist/, no solo en public/.
          test -f dist/og-card.png || { echo "::error::falta dist/og-card.png"; exit 1; }

          # og:image absoluta: los scrapers de LinkedIn y WhatsApp no resuelven
          # rutas relativas, y una card rota no avisa — simplemente no aparece.
          grep -q 'property="og:image" content="https://' dist/index.html \
            || { echo "::error::og:image ausente o con URL relativa"; exit 1; }

          # Y que el archivo que promete el meta exista de verdad en dist/.
          imagen=$(grep -oP 'property="og:image" content="https://[^"]+' dist/index.html \
                   | head -1 | sed 's/.*\///; s/?.*//')
          test -f "dist/${imagen}" \
            || { echo "::error::og:image apunta a ${imagen}, que no está en dist/"; exit 1; }

          # Los CV son el destino del botón de descarga del hero, uno por
          # idioma. Las rutas NO se escriben acá: se leen de content.js, que es
          # quien las decide. Hardcodearlas sería tener el nombre del archivo
          # en dos lugares y descubrir el desacople recién en producción.
          node --input-type=module -e '
            const es = await import("./src/data/content.js")
            const en = await import("./src/data/content.en.js")
            console.log(es.profile.cv)
            console.log(en.profile.cv)
          ' > /tmp/cv-rutas.txt

          while read -r ruta; do
            test -f "dist${ruta}" \
              || { echo "::error::profile.cv apunta a ${ruta}, que no está en dist/"; exit 1; }
            echo "  ✔ dist${ruta}"
          done < /tmp/cv-rutas.txt

          echo "✔ index.html, og-card.png (${imagen}) y los CV presentes en dist/"

      - name: Verificar la consola interactiva
        # El intérprete es una función pura, así que se ejercita sin navegador:
        # todos los comandos, en los dos idiomas y con el panel de estado en
        # sus tres situaciones (consultando, todo verde, con fallos).
        run: npm run verificar:consola
