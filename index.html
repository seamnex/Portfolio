<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0F19" />
    <!-- El SVG es el que usan los navegadores modernos; el .ico queda como
         fallback para Safari, que no soporta favicons SVG, y para cualquier
         cliente que pida /favicon.ico por defecto. El orden importa: el
         navegador se queda con la última declaración que sabe interpretar. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Título, descripción y tarjetas sociales con la síntesis del perfil:
         es lo único que un crawler, un parser de ATS o el scraper de
         LinkedIn leen sin ejecutar JavaScript. El JSON-LD (schema.org
         Person) lo inyecta Vite en el build desde src/data/content.js, ver
         scripts/seo.mjs. Si cambiás el rol allá, cambialo acá también. -->
    <title>Samuel García Baciliadis — IT Incident Manager / SRE Analyst</title>
    <meta
      name="description"
      content="IT Incident Manager / SRE Analyst en Buenos Aires, Argentina. Más de 8 años en operaciones IT: gestión de incidentes críticos P1/P2 en Fintech (Personal Pay) y Telecomunicaciones, observabilidad con Dynatrace, Datadog y Elastic, RCA y reducción de MTTR. Laboratorios propios de Kubernetes, observabilidad y chaos engineering con métricas publicadas."
    />
    <meta name="author" content="Samuel Eduardo García Baciliadis" />
    <meta
      name="keywords"
      content="IT Incident Manager, SRE Analyst, Site Reliability Engineering, Incident Management, ITIL, Observabilidad, Dynatrace, Datadog, Elastic, Kubernetes, DevOps, Buenos Aires, Argentina, LATAM"
    />
    <meta name="geo.region" content="AR-C" />
    <meta name="geo.placename" content="Buenos Aires, Argentina" />
    <meta property="og:title" content="Samuel García Baciliadis — IT Incident Manager / SRE Analyst" />
    <meta
      property="og:description"
      content="Gestión de incidentes críticos P1/P2 en Fintech y Telecomunicaciones, observabilidad (Dynatrace, Datadog, Elastic), RCA y reducción de MTTR. Labs propios de Kubernetes y chaos engineering con métricas publicadas. Buenos Aires · Argentina y LATAM."
    />
    <meta property="profile:first_name" content="Samuel" />
    <meta property="profile:last_name" content="García Baciliadis" />
    <meta property="og:type" content="profile" />
    <meta property="og:url" content="https://portfolio-eight-ashen-34.vercel.app/" />
    <meta property="og:site_name" content="Samuel García Baciliadis" />
    <meta property="og:locale" content="es_AR" />
    <!-- La URL de og:image tiene que ser absoluta: el scraper de LinkedIn o
         WhatsApp no resuelve rutas relativas. Cada vez que cambie la imagen
         conviene subirle el ?v=, porque esos scrapers cachean por URL y de
         otro modo siguen mostrando la card vieja durante días. -->
    <meta property="og:image" content="https://portfolio-eight-ashen-34.vercel.app/og-card.png?v=3" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Samuel García Baciliadis — del incidente crítico a la resiliencia por diseño. Auto-healing 7,2 s, rolling update 0 fallos, MTTD 25,6 s."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Samuel García Baciliadis — IT Incident Manager / SRE Analyst" />
    <meta
      name="twitter:description"
      content="Gestión de incidentes críticos P1/P2 en Fintech y Telecomunicaciones, observabilidad (Dynatrace, Datadog, Elastic), RCA y reducción de MTTR. Labs propios de Kubernetes y chaos engineering con métricas publicadas. Buenos Aires · Argentina y LATAM."
    />
    <meta name="twitter:image" content="https://portfolio-eight-ashen-34.vercel.app/og-card.png?v=3" />
    <link rel="canonical" href="https://portfolio-eight-ashen-34.vercel.app/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
